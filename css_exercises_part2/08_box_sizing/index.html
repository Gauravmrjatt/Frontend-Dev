<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box-Sizing Comparison</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>Box-Sizing Comparison</h1></header>
<main>
  <div class="container">
    <div class="box default">Default box-sizing (content-box)</div>
    <div class="box border-box">box-sizing: border-box</div>
  </div>
  <p class="explain">Both boxes have equal width and the same padding/border. Observe how box-sizing affects the resulting total width. Resize the screen to see responsiveness.</p>
</main>
<footer>Contrasting colors and text explain behavior.</footer>
</body>
</html>
