<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tooltips Demo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>Tooltip Demonstration</h1></header>
<main class="page">
  <div class="row">
    <div class="tooltip-wrap" tabindex="0">
      <div class="tooltip-target">Hover me</div>
      <div class="tooltip">Tooltip text appears smoothly above the element.</div>
    </div>
    <div class="tooltip-wrap" tabindex="0">
      <div class="tooltip-target">Icon</div>
      <div class="tooltip">Another tooltip with explanation.</div>
    </div>
    <div class="tooltip-wrap" tabindex="0">
      <div class="tooltip-target">Word</div>
      <div class="tooltip">Tips stay readable and positioned above.</div>
    </div>
  </div>
</main>
<footer>Tooltips built with position:absolute and opacity transitions.</footer>
</body>
</html>
