<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini UI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="page">
  <header class="header"><h1>Mini UI</h1></header>
  <main class="container">
    <section class="card">
      <form>
        <div class="form-row">
          <input class="input" type="text" placeholder="Name">
          <input class="input" type="email" placeholder="Email">
        </div>
        <div style="display:flex;align-items:center;gap:1rem">
          <button class="btn">Submit</button>
          <img src="https://picsum.photos/seed/ui/120/120" alt="small image">
        </div>
      </form>
    </section>
  </main>
  <footer style="text-align:center;padding:1rem">Mini UI footer</footer>
</body>
</html>
