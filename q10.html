<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Q10 - Flex + Grid Layout</title>
  <link rel="stylesheet" href="q10.css"/>
</head>
<body>
  <header class="top">
    <div class="logo">Logo</div>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Blog</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="container">
    <article class="article">
      <h1 class="animated-title">Article Title</h1>
      <div class="flex-row">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
      </div>
      <p>Article content goes here. This layout uses Grid for the main two-column area and Flexbox for the internal boxes.</p>
    </article>

    <aside class="aside">
      <h3>Sidebar</h3>
      <p>Links / info</p>
    </aside>
  </main>

  <footer class="foot">© 2025 Example</footer>
</body>
</html>
