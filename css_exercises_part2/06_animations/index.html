<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS Animations</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>Animations</h1></header>
<main>
  <div class="stage">
    <div class="box move" style="animation-delay:0s;animation-iteration-count:infinite">Move</div>
    <div class="box bounce" style="animation-delay:0.2s;animation-iteration-count:infinite">Bounce</div>
    <div class="box color" style="animation-delay:0.5s;animation-iteration-count:infinite">Color</div>
  </div>
</main>
<footer>Animations use @keyframes with delays and different timing properties.</footer>
</body>
</html>
